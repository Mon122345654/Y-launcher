function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function pick(){try{const s=localStorage.getItem("yl-lang");if(s&&T[s])return s}catch(e){}

 if(/^Europe\/(Moscow|Kaliningrad|Samara|Volgograd|Saratov|Astrakhan|Ulyanovsk|Kirov|Minsk)$/.test(tz))return"ru";

async function jget(u){const c=new AbortController(),t=setTimeout(()=>c.abort(),7000);try{const r=await fetch(u,{signal:c.signal});if(!r.ok)throw new Error(r.status);return await r.json()}finally{clearTimeout(t)}}
function opts(sel,list,first){const v=sel.value;sel.innerHTML=(first!=null?`<option value="">${first}</option>`:"")+list.map(x=>Array.isArray(x)?`<option value="${x[0]}">${x[1]}</option>`:`<option>${x}</option>`).join("");sel.value=v}
function apply(l){L=l;const t=T[l];document.documentElement.lang=HL[l];$("#lang").value=l;
 document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t[e.dataset.i]);
 $("#q").placeholder=t.ph;
 $("#fc").innerHTML=t.f.map(x=>`<div class="card"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join("");
 $("#fe").innerHTML=t.fe.map(x=>`<div><b>${x[0]}</b><span>${x[1]}</span></div>`).join("");
 $("#code").innerHTML=t.code.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join("");
 $("#tabs").innerHTML=t.tabs.map((x,i)=>`<button data-t="${i}" class="${i==type?"on":""}">${x}</button>`).join("");
 opts($("#sort"),t.sorts.map((x,i)=>[SORTS[i],x]));opts($("#ver"),VERS,t.allV);opts($("#ldr"),LOADERS,t.allL);search()}
let off=0,all=[],tot=0;
async function search(more){const id=++seq,t=T[L],q=$("#q").value.trim(),v=$("#ver").value,g=$("#ldr").value;
 $("#ldr").disabled=type!=0;
 const f=[["project_type:"+TYPES[type]]];if(v)f.push(["versions:"+v]);if(g&&type==0)f.push(["categories:"+g].concat(g=="quilt"?["categories:fabric"]:[]));
 if(!more){off=0;all=[];$("#res").innerHTML=`<div class="empty">…</div>`}else{const m=$("#more");if(m)m.disabled=true}
 const u=`${API}/search?query=${encodeURIComponent(q)}&facets=${encodeURIComponent(JSON.stringify(f))}&index=${$("#sort").value||"relevance"}&limit=20&offset=${off}`;let hits,isLive=true;
 try{const o=await jget(u);hits=o.hits.map(h=>({id:h.project_id,title:h.title,desc:h.description,icon:h.icon_url,author:h.author,dl:h.downloads,type:h.project_type}));tot=o.total_hits}
 catch(e){isLive=false;hits=DEMO.filter(d=>d[5]==TYPES[type]&&(!q||(d[1]+d[2]).toLowerCase().includes(q.toLowerCase()))&&(!g||type||d[4].includes(g))).map(d=>({id:d[0],title:d[1],desc:d[2],icon:"",author:d[3],dl:0,type:d[5]}));tot=hits.length;all=[]}
 if(id!=seq)return;live=isLive;off+=hits.length;all=all.concat(hits);
 $("#cnt").textContent=tot+" "+t.res;$("#src").innerHTML=`<span class="badge ${isLive?"live":"demo"}">${isLive?t.live:t.demo}</span>`;
 $("#res").innerHTML=all.length?all.map(h=>`<div class="mod"><div class="ic" style="${h.icon?`background-image:url('${esc(h.icon)}')`:""}">${h.icon?"":esc(h.title[0])}</div><div><h4>${esc(h.title)} <small>${t.by} ${esc(h.author)}</small></h4><p>${esc(h.desc)}</p></div><div class="m">${h.dl?`<small>${fmt(h.dl)} ${t.dn}</small>`:""}<button class="btn sm" data-p="${esc(h.id)}" data-n="${esc(h.title)}" data-ty="${h.type}">${t.choose}</button></div></div>`).join("")+(isLive&&all.length<tot&&hits.length?`<div class="more"><button class="btn g" id="more">${t.more}</button></div>`:""):`<div class="empty">${t.none}</div>`}
async function initTags(){try{const a=await jget(API+"/tag/game_version"),r=a.filter(x=>x.version_type=="release").sort((x,y)=>new Date(y.date)-new Date(x.date)).map(x=>x.version);if(r.length){VERS=r;opts($("#ver"),VERS,T[L].allV)}}catch(e){}}

async function loadV(){const t=T[L],{pid,ty}=cur,v=$("#dv").value,g=$("#dl2").value;$("#vl").innerHTML=`<div class="empty">…</div>`;

 catch(e){$("#vl").innerHTML=`<div class="empty">${t.demo}</div>`}}
